worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/wasm
    image/svg+xml;

  upstream pulse_backend {
    server backend:7777;
    keepalive 64;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Immutable cache for hashed Vite build chunks
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # Media/Audio/WASM game assets
    location ~* ^/(characters|skills|voices|maps|fx|app-icon\.png|favicon\.svg|sql-wasm\.wasm) {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # Go REST API proxy
    location /api/ {
      proxy_pass http://pulse_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Go Healthcheck proxy
    location = /health {
      proxy_pass http://pulse_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }

    # Go WebSocket real-time state stream (zero-buffering, low-latency upgrades)
    location /ws {
      proxy_pass http://pulse_backend/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SPA fallback with zero-cache on HTML/manifest so updates apply immediately
    location / {
      add_header Cache-Control "no-cache, must-revalidate";
      try_files $uri $uri/ /index.html;
    }
  }
}
